<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>115單字比賽 集訓三 練習 詳解｜Training Week 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EBEE; --card:#FDFDFC;
  --ink:#10202F; --ink-2:#56687A; --ink-3:#7C8B99;
  --rule:#C6D0D8; --pen:#17457E; --hl:#FFE773; --miss:#A34234;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  --read:'Literata',Georgia,'Times New Roman',serif;
  --han:'PingFang TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--han);font-size:16px;line-height:1.75}
:focus-visible{outline:2px solid var(--pen);outline-offset:3px;border-radius:2px}

.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.top-in{max-width:var(--maxw);margin:0 auto;padding:14px 24px 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px}
.title{font-size:23px;font-weight:600;margin:0;line-height:1.3}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin:4px 0 0;letter-spacing:.04em}
.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:12px 0 11px;margin-top:10px;border-top:1px solid var(--rule)}
.chip{font-family:var(--mono);font-size:12px;letter-spacing:.04em;border:1px solid var(--rule);background:transparent;color:var(--ink-2);padding:5px 10px;border-radius:999px;cursor:pointer;text-decoration:none;transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--pen);color:var(--pen)}
.chip.solid{margin-left:auto;border-color:var(--ink);color:var(--ink);font-weight:500}
.chip.solid:hover{background:var(--ink);color:var(--card)}

.wrap{max-width:var(--maxw);margin:0 auto;padding:28px 24px 96px;display:grid;gap:36px;grid-template-columns:minmax(0,1fr) 288px}
@media (max-width:1020px){.wrap{grid-template-columns:minmax(0,1fr);gap:44px}}

.sec{margin:0 0 48px;scroll-margin-top:136px}
.sec-head{display:flex;align-items:baseline;gap:12px;padding-bottom:9px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.sec-num{font-family:var(--mono);font-size:12px;letter-spacing:.16em;color:var(--ink-3)}
.sec-label{font-size:18px;font-weight:600;margin:0}
.sec-score{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-left:auto}
.sec-inst{font-size:13.5px;color:var(--ink-2);margin:9px 0 0}

.bank{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);margin:16px 0 0}
@media (max-width:760px){.bank{grid-template-columns:repeat(2,1fr)}}
.bank-i{background:var(--card);padding:8px 10px;font-family:var(--read);font-size:14.5px}
.bank-i span{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-right:5px}
.bank-i.used{background:#F2F5F6;color:var(--ink-3)}

.passage{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--ink);padding:22px 26px;margin:18px 0 0;font-family:var(--read);font-size:16.5px;line-height:1.95;color:#1a2836}
.passage p{margin:0 0 1em}
.passage p:last-child{margin-bottom:0}
.blank{display:inline-block;min-width:70px;text-align:center;border:0;border-bottom:1.5px solid var(--ink);font-family:var(--mono);font-size:13px;color:var(--pen);cursor:pointer;background:none;padding:0 4px;line-height:1.4}
.blank:hover{background:rgba(23,69,126,.07)}
.blank.filled{font-family:var(--read);font-size:16.5px;color:var(--ink);border-bottom-color:transparent;min-width:0}
.blank sup{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-right:2px}
.zhbtn{display:block;margin:0 0 18px;background:var(--card);border:1px solid var(--rule);border-top:0;width:100%;text-align:left;padding:8px 26px;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--pen);cursor:pointer}
.zhbtn:hover{color:var(--ink)}
.zhbtn::after{content:' ▾'}
.zhbtn.on::after{content:' ▴'}
.zhbox{display:none;background:#F7F9FA;border:1px solid var(--rule);border-top:0;padding:18px 26px;margin:0 0 18px;font-size:15px;line-height:1.95;color:#22323F}
.zhbox.on{display:block}
.zhbox p{margin:0 0 .9em}
.zhbox p:last-child{margin:0}

.q{background:var(--card);border:1px solid var(--rule);margin:14px 0 0;scroll-margin-top:142px}
.q-top{padding:16px 22px 14px}
.q-tag{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.q-n{font-family:var(--mono);font-size:13px;font-weight:600}
.q-kind{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.prompt{font-size:14.5px;line-height:1.85;color:var(--ink-2);margin:0 0 11px;padding-left:11px;border-left:2px solid var(--rule)}
.stem{font-family:var(--read);font-size:16.5px;line-height:1.85;margin:0 0 13px;color:#1a2836}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:2px 20px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:9px;font-family:var(--read);font-size:15.5px;line-height:1.6;padding:3px 0;color:#243342}
.opt-k{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);padding-top:2px;flex:none}
.reveal{display:block;width:100%;text-align:left;margin-top:14px;background:none;border:0;border-top:1px dashed var(--rule);padding:11px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--pen);cursor:pointer}
.reveal:hover{color:var(--ink)}
.reveal::after{content:' ▾'}
.q.open .reveal::after{content:' ▴'}
.q.open .reveal{color:var(--ink-3)}

.body{display:none;border-top:1px solid var(--rule);background:#F7F9FA;padding:18px 22px 20px}
.q.open .body{display:block}
.ans{display:flex;align-items:baseline;gap:10px;margin:0 0 13px;flex-wrap:wrap}
.ans-k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--ink-3);flex:none;padding-top:2px}
.ans-v{font-family:var(--read);font-size:18px;font-weight:600}
.fills{list-style:none;margin:0 0 13px;padding:0}
.fill{display:flex;gap:11px;align-items:baseline;padding:7px 0;border-bottom:1px dotted var(--rule)}
.fill-k{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none;width:26px}
.fill-w{font-family:var(--read);font-size:17px;font-weight:600;flex:none}
.fill-n{font-size:13.5px;color:var(--ink-2);line-height:1.7}
.zh{font-size:15px;line-height:1.85;margin:0 0 14px;color:#22323F}
.why{font-size:14.5px;line-height:1.85;margin:0 0 4px;color:#22323F;border-top:1px solid var(--rule);padding-top:12px}
.lines{margin:0;padding:0;list-style:none;border-top:1px solid var(--rule)}
.line{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14.5px;line-height:1.75;color:var(--ink-2)}
.line-k{font-family:var(--mono);font-size:12.5px;flex:none;width:28px;color:var(--ink-3);padding-top:2px}
.line.right{color:var(--ink)}
.line.right .line-k{color:var(--ink);font-weight:600}
.line.right .line-k::after{content:'✓';display:block;font-size:12px;line-height:1.3}
.line.wrong .line-k{color:var(--miss);opacity:.85}
.line.wrong .line-k::after{content:'✗';display:block;font-size:12px;line-height:1.3}
.evid{margin:15px 0 0;font-family:var(--read);font-size:14.5px;line-height:1.8;color:var(--ink-2);padding-left:13px;border-left:2px solid var(--hl)}
.evid span{font-family:var(--han);font-size:11px;letter-spacing:.14em;color:var(--ink-3);display:block;margin-bottom:3px}

.hl{background-image:linear-gradient(transparent 12%,var(--hl) 12%,var(--hl) 90%,transparent 90%);background-repeat:no-repeat;background-size:0% 100%;transition:background-size .55s cubic-bezier(.2,.75,.3,1);border-radius:1px}
.hl.on{background-size:100% 100%}

.sample{margin:15px 0 0;border:1px solid var(--rule);border-left:3px solid var(--ink);background:var(--card);padding:16px 20px}
.sample p:not(.note-h){font-family:var(--read);font-size:15.5px;line-height:1.9;color:#1a2836;margin:0 0 1em}
.sample p:last-child{margin-bottom:0}
.bank.wide{grid-template-columns:1fr}
.bank.wide .bank-i{font-size:15px;line-height:1.7;padding:10px 14px}
.note{margin:15px 0 0;border:1px solid var(--rule);background:var(--card);padding:13px 16px}
.note-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 9px}
.note-i{margin:0;padding:9px 0 0;border-top:1px dotted var(--rule)}
.note-i:first-of-type{border-top:0;padding-top:0}
.term{font-family:var(--read);font-size:16px;font-weight:600}
.pos{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin:0 6px}
.gloss{font-size:14.5px}
.ex{font-family:var(--read);font-size:14px;color:var(--ink-2);line-height:1.7;margin:3px 0 0;display:block}
.ex i{font-family:var(--han);font-style:normal;font-size:13px;color:var(--ink-3);display:block}

.side{position:sticky;top:136px;align-self:start;max-height:calc(100vh - 164px);overflow:auto;padding-right:4px}
@media (max-width:1020px){.side{position:static;max-height:none;scroll-margin-top:136px}}
.side-h{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0 0 3px}
.side-t{font-size:16px;font-weight:600;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.card-list{margin:0;padding:0;list-style:none}
.card-item{border-bottom:1px solid var(--rule);padding:11px 0}
.card-item a{display:block;text-decoration:none;color:inherit}
.card-item a:hover .term{background:var(--hl)}
.jump{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);float:right;padding-top:5px}
.side-note{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin:16px 0 0}
.foot{max-width:var(--maxw);margin:0 auto;padding:0 24px 48px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

@media print{
  body{background:#fff;font-size:10.5pt}
  .top,.side,.reveal,.foot,.zhbtn{display:none!important}
  .wrap{display:block;max-width:none;padding:0}
  .q .body{display:block!important}
  .zhbox{display:block!important}
  .q{break-inside:avoid;border-color:#999;margin-bottom:9pt}
  .passage{break-inside:avoid}
  .hl{background-size:100% 100%!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <p class="eyebrow" id="brand"></p>
    <h1 class="title" id="examTitle"></h1>
    <p class="meta" id="examMeta"></p>
    <nav class="bar" id="nav"></nav>
  </div>
</header>

<div class="wrap"><main id="main"></main><aside class="side" id="side"></aside></div>
<p class="foot" id="foot"></p>

<script>
/* ==========================================================================
   ①  題目與詳解全部寫在下面的 EXAM 物件裡。要改題、加題、修字，只動這裡。

   section（大題）：{ id, label, score, instruction, bank?, groups: [...] }
   group（同一篇文章的題組）：{ passage?, zh?, questions: [...] }
       passage 裡寫 __7__ 就會變成可點的空格，數字對應題號。
       zh 是全文中譯，會做成可展開的按鈕。

   question 依題型三選一：
     選擇題   { n, kind, stem, options:{A..D}, answer:"B", translation, explain:{A..D}, evidence?, notes? }
     單一填答 { n, kind, stem, answerText:"prejudice", why, notes? }
     多格填答 { n, kind, prompt, stem, answers:[{k:"①", w:"字", note:"說明"}], notes? }
   ========================================================================== */
const EXAM = {
  brand: "Vocabulary Competition",
  title: "115單字比賽 集訓三 練習 詳解｜Training Week 3",
  meta: "Instructor: Howard Chang　·　範圍：集訓三 (115/10/30)",
  footer: "KGHS 115 英文單字比賽 集訓(三) 練習卷",
  sections: [
  {
    id:"sp", label:"測驗一、聽英拼寫", score:"第 1-50 題",
    instruction:"依聽力播放之英文拼寫出正確單字，每題播放兩次。點開可看音節、重音、音標與拼寫陷阱。",
    groups:[{
      questions:[
        { n:1, kind:"n.", answerText:"sovereignty", stem:"主權、統治權",
          translation:"SOV-er-eign-ty　/ˈsɑːvrənti/　重音在第一音節",
          why:"最容易錯的地方是中間的 -eign-，與 foreign、reign 同一組拼法。另一個常見錯誤是寫成 sovereignity（多了一個 i）：正確是 sovereign ＋ -ty，不要自己加音節。",
          notes:[{term:"sovereignty / sovereign", pos:"字族", gloss:"n. 主權／adj. 有主權的、n. 君主。national sovereignty 國家主權。注意 sovereign 的 g 不發音。"}]},

        { n:2, kind:"n.", answerText:"Fahrenheit", stem:"華氏（溫度）",
          translation:"FAHR-en-heit　/ˈfærənhaɪt/　重音在第一音節",
          why:"源自德國物理學家的姓，所以首字母一定要大寫。拼寫陷阱在前後兩段：Fahr-（不是 Far-）與 -heit（不是 -hite、-height）。",
          notes:[{term:"Fahrenheit / Celsius", pos:"字彙", gloss:"華氏／攝氏。32°F ＝ 0°C。Celsius 也要大寫（又作 centigrade，此字不大寫）。"}]},

        { n:3, kind:"n.", answerText:"laundry", stem:"待洗（或洗好）的衣物；洗衣店",
          translation:"LAUN-dry　/ˈlɔːndri/　重音在第一音節",
          why:"母音組合是 au 而不是 aw 或 ou。字尾 -dry 不要漏掉 d，do the laundry 是最常用的搭配。",
          notes:[{term:"laundry", pos:"n.", gloss:"do the laundry 洗衣服／a laundry basket 洗衣籃／money laundering 洗錢（v. launder）。"}]},

        { n:4, kind:"adj. / v.", answerText:"deliberate", stem:"故意的、慎重的／仔細考慮",
          translation:"形容詞 de-LIB-er-ate　/dɪˈlɪbərət/　動詞 /dɪˈlɪbəreɪt/　重音都在第二音節",
          why:"拼法只有一種，但詞性不同時字尾發音不同（形容詞 /-rət/、動詞 /-reɪt/），聽寫時不要被動詞的 /eɪt/ 音誘導寫成 -ait。中間是 -lib-，不是 -lip-。",
          notes:[{term:"deliberate", pos:"adj. / v.", gloss:"adj. 故意的（a deliberate lie）、慎重的；v. 仔細討論。adv. deliberately 故意地；n. deliberation 審慎考慮。"}]},

        { n:5, kind:"n.", answerText:"inhabitant", stem:"居民、棲息的動物",
          translation:"in-HAB-it-ant　/ɪnˈhæbɪtənt/　重音在第二音節",
          why:"字尾是 -ant 不是 -ent（inhabit ＋ -ant）。中間的 -hab- 只有一個 b。",
          notes:[{term:"inhabit / inhabitant", pos:"字族", gloss:"vt. inhabit 居住於（直接接地點，不加 in）／n. inhabitant 居民／adj. inhabited 有人居住的（反義 uninhabited 無人居住的）。"}]},

        { n:6, kind:"n.", answerText:"burglar", stem:"（闖入建築物行竊的）竊賊",
          translation:"BUR-glar　/ˈbɜːrɡlər/　重音在第一音節",
          why:"字尾是 -ar 不是 -er，這是最常見的錯誤。另外 -rgl- 三個子音相連，不要在中間多加母音寫成 burgular。",
          notes:[{term:"burglar / burglary", pos:"字族", gloss:"n. 竊賊／n. burglary 入室行竊（罪名）／v. burgle 入室行竊。對照 robber 搶劫犯（有暴力或威脅）／thief 小偷（泛稱）。"}]},

        { n:7, kind:"n. / v.", answerText:"herald", stem:"先驅、預兆／預示、宣告",
          translation:"HER-ald　/ˈherəld/　重音在第一音節",
          why:"注意是 her- ＋ -ald，不要寫成 herold 或 harald。與 Harold（人名）只差一個字母，聽寫時靠第一個母音 /e/ 判斷。",
          notes:[{term:"herald", pos:"v. / n.", gloss:"v. 預示、宣告（The move heralds a new era. 這一步預示了新時代）；n. 先驅、預兆。許多報紙以 Herald 為名。"}]},

        { n:8, kind:"n. / v.", answerText:"triumph", stem:"勝利、大成功／獲勝",
          translation:"TRI-umph　/ˈtraɪəmf/　重音在第一音節",
          why:"字尾 -ph 發 /f/，是全字最大的陷阱，不要寫成 triumf。中間是 -umph，不是 -umf 或 -ump。",
          notes:[{term:"triumph", pos:"n. / v.", gloss:"n. 勝利（a great triumph）；v. triumph over sth 戰勝某事。adj. triumphant 得意洋洋的；adv. triumphantly。"}]},

        { n:9, kind:"n.", answerText:"voyage", stem:"（長途的）航海、航行",
          translation:"VOY-age　/ˈvɔɪɪdʒ/　重音在第一音節",
          why:"字尾 -age 發 /ɪdʒ/ 而不是 /eɪdʒ/，與 village、message 同類。注意是 voy- 不是 voi-。",
          notes:[{term:"voyage", pos:"n.", gloss:"長途航行（a sea voyage／a maiden voyage 處女航）。n. voyager 航海者。對照 trip 一般旅程／journey 陸上長途旅行／flight 飛行。"}]},

        { n:10, kind:"n.", answerText:"carbohydrate", stem:"碳水化合物、醣類",
          translation:"car-bo-HY-drate　/ˌkɑːrboʊˈhaɪdreɪt/　主重音在第三音節",
          why:"把它拆成 carbo（碳）＋ hydrate（水合物）就不會拼錯。常見錯誤是漏掉中間的 o 寫成 carbhydrate，或把 hy- 寫成 hi-。",
          notes:[{term:"carbohydrate", pos:"n.", gloss:"碳水化合物（口語簡稱 carbs）。同類營養素：protein 蛋白質／fat 脂肪／fiber 纖維／calcium 鈣。"}]},

        { n:11, kind:"n.", answerText:"concession", stem:"讓步、（票價等）優惠",
          translation:"con-CES-sion　/kənˈseʃn/　重音在第二音節",
          why:"雙 s 是關鍵（-cession），與 concede（讓步）同源但拼法變了。對照 concentration、conservation 這些 con- 字首的字，不要把 -cess- 寫成 -ses-。",
          notes:[{term:"concession", pos:"n.", gloss:"① 讓步（make a concession）② 優惠票價（student concessions）。v. concede 承認、讓步。本卷測驗二第 15 題考的就是第二個字義。"}]},

        { n:12, kind:"n.", answerText:"hypocrite", stem:"偽君子、言行不一的人",
          translation:"HYP-o-crite　/ˈhɪpəkrɪt/　重音在第一音節",
          why:"注意兩個 y／i 的位置：hyp-（y）、-crite（i）。字尾 -crite 的 i 發 /ɪ/ 而不是 /aɪ/。它的名詞 hypocrisy 重音跑到第二音節（/hɪˈpɑːkrəsi/）且拼法變成 -crisy，兩個字要分開記。",
          notes:[{term:"hypocrite / hypocrisy / hypocritical", pos:"字族", gloss:"n. 偽君子／n. 偽善（hypocrisy，注意沒有 t）／adj. 偽善的。字首 hypo- 在下、不足（hypothesis 假設／hypothermia 體溫過低）。"}]},

            B:"genuine 意為「真正的、真誠的」，強調非偽造；a genuine fight 會變成「真的在打而不是假打」，與英勇無關。",
            C:"versatile 意為「多才多藝的、多功能的」，形容人的才能或物品的用途廣；它無法形容一場戰鬥的英勇。",
            D:"credible 意為「可信的」，談的是可信度（a credible witness）；一場戰鬥不會「可信」。"
          },
          notes:[
            {term:"valiant", pos:"adj.", gloss:"勇猛的（a valiant effort／attempt 英勇的嘗試；put up a valiant fight）。n. valor 英勇；同義 courageous／gallant／heroic。", ex:"They made a valiant attempt to save the ship.", exZh:"他們英勇地試圖搶救那艘船。"},
            {term:"outnumber", pos:"vt.", gloss:"在數量上超過（be outnumbered 寡不敵眾／outnumber sb two to one 以二比一的人數占優）。同型字：outperform 表現更佳／outlive 活得更久／outweigh 重於。"}
          ]},

        { n:12, kind:"名詞",
          stem:"Before returning to work after a serious injury, employees must obtain a certificate from a qualified medical ______ confirming that they are fit for duty.",
          options:{A:"personnel （全體）員工、人事",B:"commentator 評論員、球評",C:"successor 繼任者",D:"practitioner 執業人員（尤指醫師）"}, answer:"D",
          translation:"在重傷後復工之前，員工必須取得合格執業醫師開立的證明，確認他們身體狀況適合工作。",
          explain:{
            A:"personnel 意為「全體員工」或「人事部門」，是集合名詞，前面不會加 a；而且開立診斷證明的是個別醫師，不是一整個人事單位。",
            B:"commentator 意為「評論員、球評」，負責解說賽事或時事；他無權開立醫療證明。",
            C:"successor 意為「繼任者」，講的是職位接替；與醫療證明無關。",
            D:"a medical practitioner 是固定說法，意為「執業醫師」。兩個線索：修飾語 qualified medical（合格醫療的）與任務 confirming that they are fit for duty（確認適合工作）——這份證明必須由有執照的醫師開立。"
          },
          notes:[
            {term:"practitioner", pos:"n.", gloss:"執業人員（a medical practitioner 執業醫師／a general practitioner, GP 家庭醫師／a legal practitioner 執業律師）。v. practice 執業。", ex:"Consult a qualified medical practitioner first.", exZh:"請先諮詢合格的執業醫師。"},
            {term:"personnel", pos:"n.", gloss:"全體人員（複數概念，不加 a／s）；the personnel department 人事部。與 personal（個人的）只差重音與一個 n，常被混用。"}
          ]},

        { n:13, kind:"動詞",
          stem:"Years of strict lockdowns have ______ the nation's healthcare budget, leaving hospitals short of staff and poorly prepared for the next major epidemic.",
          options:{A:"flourished 繁榮興盛",B:"retrieved 取回、挽回",C:"drained 耗盡、抽乾",D:"hastened 加速、催促"}, answer:"C",
          translation:"多年的嚴格封控已經耗盡這個國家的醫療預算，讓醫院人力短缺，也難以應對下一場大型疫情。",
          explain:{
            A:"flourish 意為「繁榮興盛」，是不及物動詞，後面不接受詞；而且結果 leaving hospitals short of staff（讓醫院人力短缺）是衰敗而非興盛，語意相反。",
            B:"retrieve 意為「取回、挽回」，是把失去的東西拿回來；若預算被挽回，醫院就不會人力短缺了。",
            C:"drain 意為「耗盡、抽乾」。決定性線索是分詞結果：leaving hospitals short of staff and poorly prepared（讓醫院人力短缺、準備不足）——錢花光了才會如此。受詞 budget（預算）也正是 drain 的典型搭配。",
            D:"hasten 意為「加速、催促」，受詞通常是過程或事件（hasten the decline 加速衰退）；預算本身不是一個可以被加速的過程。"
          },
          notes:[
            {term:"drain", pos:"vt. / n.", gloss:"① 耗盡（drain resources／energy／the budget）② 抽乾（drain the water）；n. 排水管、消耗（a drain on resources 資源的耗損）。", ex:"The lawsuit drained the company's cash.", exZh:"這場訴訟耗盡了公司的現金。"},
            {term:"brain drain", pos:"phr.", gloss:"人才外流。相關：a drain on sth 對某物的消耗／go down the drain 白費、付諸流水。"}
          ]},

        { n:14, kind:"過去分詞",
          stem:"Watching a video of vendors selling braised pork rice, Henry was so ______ by homesickness that he booked a flight back to Taiwan that night.",
          options:{A:"overwhelmed （情緒上）被徹底淹沒、無法承受",B:"besieged 被圍攻、被（請求等）淹沒",C:"deteriorated 惡化",D:"manipulated 被操縱"}, answer:"A",
          translation:"看著攤販賣滷肉飯的影片，亨利被思鄉之情徹底淹沒，當晚就訂了回臺灣的機票。",
          explain:{
            A:"be overwhelmed by + 情緒 是標準搭配，意為「被某種情緒徹底淹沒」。兩個線索：so ... that 的結果 he booked a flight back to Taiwan that night（當晚就訂機票回台）顯示情緒強烈到無法克制，而 homesickness（思鄉）正是 overwhelmed 最常搭配的情感之一。",
            B:"besiege 意為「圍攻」，比喻用法是 be besieged by requests／reporters／questions（被請求、記者、問題淹沒），搭配的是外來的大量人事物，不是內心的情緒。這是本題最需要分辨的選項。",
            C:"deteriorate 意為「惡化」，是不及物動詞，不能用被動式 be deteriorated；而且惡化的主詞是情況或健康，不是人被情緒影響。",
            D:"manipulate 意為「操縱」，指有人刻意擺布；思鄉之情不是誰在操縱他。"
          },
          notes:[
            {term:"be overwhelmed by", pos:"phr.", gloss:"被（情緒、工作量）淹沒（overwhelmed by grief／joy／work）。adj. overwhelming 壓倒性的（an overwhelming majority 壓倒性多數）。", ex:"She was overwhelmed by their kindness.", exZh:"她被他們的好意深深感動。"},
            {term:"besiege", pos:"vt.", gloss:"圍攻；比喻被大量外來事物淹沒（be besieged by reporters）。n. siege 圍城（lay siege to 圍攻／under siege 被圍困）。"}
          ]},

        { n:15, kind:"名詞",
          stem:"In many cities, senior citizens and full-time students are entitled to ______ on public transport, which means they pay only half the regular adult fare.",
          options:{A:"abbreviations 縮寫",B:"permissions 許可",C:"compromises 妥協、折衷",D:"concessions 優惠（票價）；讓步"}, answer:"D",
          translation:"在許多城市，敬老與全職學生都享有公共運輸的票價優惠，也就是只需付成人票價的一半。",
          explain:{
            A:"abbreviations 意為「縮寫」，是語言形式；它與車票價格無關。",
            B:"permissions 意為「許可」，是允許做某事；但老人與學生需要的不是「被允許搭車」，而是便宜的票價。這是語意方向對了一半的誘答。",
            C:"compromises 意為「妥協、折衷」，是雙方各讓一步的結果；票價優惠是單方面給予的福利，不是協商的折衷。",
            D:"concession 在票務上專指「優惠票價」。決定性線索是關係子句的解釋：they pay only half the regular adult fare（只付成人票價的一半）——這就是優惠票的定義，而 be entitled to（享有…的權利）也符合福利的語境。"
          },
          notes:[
            {term:"concession", pos:"n.", gloss:"① 優惠票價（student／senior concessions；a concession fare）② 讓步（make a concession to sb）。本卷測驗一第 11 題考過這個字的拼寫。", ex:"Students can buy concession tickets.", exZh:"學生可以購買優惠票。"},
            {term:"be entitled to", pos:"phr.", gloss:"有權享有（be entitled to a refund／to V 有權做某事）。n. entitlement 應得的權益。"}
          ]},

        { n:16, kind:"名詞",
          stem:"After her son was killed in the war, she was prescribed a mild ______ to help her sleep and cope with the unbearable grief.",
          options:{A:"commodity 商品、大宗物資",B:"propaganda （政治）宣傳",C:"tranquilizer 鎮靜劑、安神藥",D:"tournament 錦標賽"}, answer:"C",
          translation:"兒子在戰爭中喪生後，她被開了溫和的鎮靜劑，以幫助入睡並承受難以承受的悲傷。",
          explain:{
            A:"commodity 意為「商品、大宗物資」（如石油、小麥）；醫師不會 prescribe（開立處方）一件商品。",
            B:"propaganda 意為「政治宣傳」，用於操控輿論；它不是處方藥物，也無助於入睡。",
            C:"tranquilizer 意為「鎮靜劑」。三個線索：動詞 was prescribed（被開立處方）要求空格是藥物，形容詞 mild（溫和的）符合藥效強度的描述，而目的 to help her sleep and cope with the unbearable grief（幫助入睡、承受悲傷）正是鎮靜劑的用途。",
            D:"tournament 意為「錦標賽」，是賽事；它與處方和睡眠都無關。"
          },
          notes:[
            {term:"tranquilizer", pos:"n.", gloss:"鎮靜劑（英式 tranquilliser）。adj. tranquil 平靜的；n. tranquility 寧靜。相關：sedative 鎮靜劑／painkiller 止痛藥／antibiotic 抗生素／antidepressant 抗憂鬱藥。", ex:"The vet used a tranquilizer dart.", exZh:"獸醫使用了麻醉鎮靜彈。"},
            {term:"prescribe", pos:"vt.", gloss:"開處方、規定（prescribe medicine for sb）。n. prescription 處方（a prescription drug 處方藥／over-the-counter 非處方的）。"}
          ]},

        { n:17, kind:"名詞",

          options:{A:"dandruff 頭皮屑",B:"sermons 說教、佈道",C:"wharfs 碼頭",D:"trouts 鱒魚"}, answer:"B",

          explain:{

            C:"wharfs 意為「碼頭」（複數亦作 wharves），是港口設施；它無法被 deliver（發表）。",

          notes:[
            {term:"sermon", pos:"n.", gloss:"① 佈道、講道（deliver／give a sermon）② 冗長的說教（Don't give me a sermon.）。v. preach 佈道、說教。", ex:"Spare me the sermon on healthy eating.", exZh:"健康飲食的說教就免了吧。"},
            {term:"preach / sermon / lecture", pos:"字彙", gloss:"preach（動詞）說教／sermon（名詞）說教、佈道／lecture 當名詞也可指「訓話」（give sb a lecture 教訓某人一頓）。"}
          ]},

        { n:18, kind:"形容詞",
          stem:"Flight attendants are trained to stay calm and ______ toward passengers, even those who shout at them angrily over flight delays nobody can control.",
          options:{A:"accessible 易接近的、可取得的",B:"courteous 有禮貌的、客氣的",C:"magnificent 宏偉壯麗的",D:"subordinate 下屬的、次要的"}, answer:"B",
          translation:"空服員受訓要對乘客保持冷靜與禮貌，即使面對那些為了無人能控制的航班延誤而對他們大吼的乘客。",
          explain:{
            A:"accessible 意為「易接近的」或「可取得的」（an accessible website 無障礙網站）；它描述的是可及性，不是待人的態度。",
            B:"courteous 意為「有禮貌的」。兩個線索：它與 calm（冷靜）並列，共同構成服務業的應對要求；而讓步子句 even those who shout at them angrily（即使面對大吼的乘客）說明這份禮貌是在受到無禮對待時仍要維持。",
            C:"magnificent 意為「宏偉壯麗的」，形容景觀、建築或表現；它不能形容待人的態度。",
            D:"subordinate 意為「下屬的、次要的」；空服員雖是受僱者，但 subordinate toward passengers 不成搭配，而且訓練的重點是禮貌而非卑屈。"
          },
          notes:[
            {term:"courteous", pos:"adj.", gloss:"有禮貌的、客氣的（be courteous to sb）。n. courtesy 禮貌（by courtesy of 蒙…允許提供）；adv. courteously。注意 courteous 的 r 不可漏。", ex:"The staff were unfailingly courteous.", exZh:"員工始終彬彬有禮。"},
            {term:"同義整理", pos:"字彙", gloss:"有禮貌：courteous／polite／civil（基本的客氣）／gracious（親切得體）。反義：rude／impolite／discourteous。"}
          ]},

        { n:19, kind:"過去分詞",
          stem:"Investigators concluded that the deadly train crash could easily have been ______ had the driver simply followed even the most basic safety procedures.",
          options:{A:"averted 避免、防止（壞事發生）",B:"bypassed 繞過、迴避",C:"cemented 使鞏固、用水泥黏合",D:"evoked 喚起（記憶、情感）"}, answer:"A",
          translation:"調查人員的結論是，只要駕駛遵守最基本的安全程序，這場致命的列車事故本來很容易就能避免。",
          explain:{
            A:"avert 意為「避免、防止（災難發生）」。兩個線索：受詞 the deadly train crash（致命事故）正是 avert 的典型搭配，而倒裝的條件句 had the driver simply followed ... safety procedures（只要駕駛遵守安全程序）說明事故本可不發生。",
            B:"bypass 意為「繞過、避開（程序或障礙）」，是從旁邊走過去而非使其不發生；而且本句的語境是駕駛沒有遵守程序，不是繞過程序。",
            C:"cement 意為「使鞏固」（cement a relationship 鞏固關係），語意是加強而非避免，方向完全相反。",
            D:"evoke 意為「喚起（記憶、情感）」；事故不是被喚起的對象，而且也與安全程序無關。"
          },
          notes:[
            {term:"avert", pos:"vt.", gloss:"① 避免、防止（avert a crisis／disaster／war）② 把（目光）移開（avert one's eyes）。n. aversion 厭惡。", ex:"Quick action averted a major accident.", exZh:"迅速的處置避免了一場重大事故。"},
            {term:"倒裝的假設語氣", pos:"句型", gloss:"had the driver followed ＝ if the driver had followed。省略 if 並把 had 提前，是正式書面語的倒裝，常見於新聞與論述。"}
          ]},

          options:{A:"solitary 獨自的、單獨一個的",B:"tentative 暫定的、試探性的",C:"continental 大陸的、洲的",D:"oriental 東方的"}, answer:"D",

            A:"solitary 意為「獨自的、單獨一個的」；但本句明確說是 a pair of（一對），兩者直接矛盾。",

          notes:[
            {term:"oriental / Oriental", pos:"adj.", gloss:"東方的（指物品時可小寫：oriental art／rugs）。n. the Orient 東方。注意用於人時具貶義，現代英文改用 Asian。集訓二作業二第 75 題也出現這個字當誘答。", ex:"The museum houses a fine oriental collection.", exZh:"這座博物館收藏了精緻的東方文物。"},
            {term:"centerpiece", pos:"n.", gloss:"① 最重要的部分、主角（the centerpiece of the plan）② 餐桌中央的裝飾。"}
          ]},

          translation:"一位來賓的醉後失態差點毀了一場原本完美的婚禮，但新娘一笑置之，請樂團繼續演奏。",

            A:"blot 當動詞意為「塗污、吸乾墨水」，受詞是具體的紙面或污漬；比喻用法固定在 blot one's copybook（損及名聲），不能直接接 a wedding。",

            D:"fuss 意為「瞎忙、小題大作」，是不及物動詞（fuss over sth）；後面接不上 a wedding 這個直接受詞。"

          notes:[
            {term:"mar", pos:"vt.", gloss:"損壞、使有瑕疵（mar the beauty／the occasion；be marred by violence 因暴力而蒙上陰影）。常用被動。", ex:"The game was marred by crowd trouble.", exZh:"這場比賽因觀眾鬧事而留下瑕疵。"},
            {term:"otherwise", pos:"adv.", gloss:"① 否則② 在其他方面（an otherwise perfect plan 若非這點就完美的計畫）。本題的線索字，表示空格要填「破壞」類的動詞。"}

        { n:22, kind:"名詞",
          stem:"After the car accident, Diane had to wear a neck ______ for six weeks to support her injured spine while the damaged ligaments slowly healed.",
          options:{A:"bosom 胸懷、胸部",B:"corpse 屍體",C:"archive 檔案庫、典藏",D:"brace 支架、護具"}, answer:"D",
          translation:"車禍後，黛安必須戴頸部護具六週，在受損的韌帶緩慢復原期間支撐她受傷的脊椎。",
          explain:{
            A:"bosom 意為「胸懷、胸部」，是身體部位而非可穿戴的器具；而且 wear a neck bosom 語意不通。",

            {term:"commit 的搭配", pos:"整理", gloss:"commit a crime／murder／suicide／fraud／atrocities。commit 後面接的一定是罪行或過失，不接中性名詞。"}

            {term:"ovation", pos:"n.", gloss:"熱烈鼓掌（a standing ovation 起立鼓掌／receive a thunderous ovation 獲得雷鳴般的喝采）。"}

            C:"tactical 意為「戰術的、策略性的」（a tactical error 戰術失誤）；它形容戰略安排，不能評價證據的證明力。",

          notes:[

            {term:"have no choice but to V", pos:"句型", gloss:"除了做某事別無選擇（but 後接原形動詞）。對照 cannot but V 與 cannot help V-ing，三者都表「不得不」。"}
          ]},

            {term:"famous / infamous / notorious", pos:"辨析", gloss:"famous 著名的（中性或正面）／infamous 與 notorious 都是「因壞事出名」。be famous for 以…聞名／be notorious for 以…惡名在外。"}

            {term:"collapse", pos:"vi.", gloss:"① （案件、談判、公司）瓦解崩潰② （建築）倒塌③ （人）昏倒。The talks collapsed. 談判破局。"}

        { n:39, kind:"過去分詞",

          translation:"去年夏天，這座島嶼有大片區域被野火嚴重摧毀，森林與野生動物要完全復原得花上數十年。",
          explain:{
            A:"inflict 的句型是 inflict sth on sb／sth（把傷害施加於某對象），被動時主詞是「傷害」而不是「受害的地方」；本句主詞是 Large parts of the island（島上大片區域），結構不合。",

            C:"smother 意為「悶住、覆蓋使窒息」（smother a fire 把火悶熄），重點是「蓋住使其無法呼吸或燃燒」；用在這裡方向反了，是火摧毀土地，不是土地被悶住。",
            D:"neglect 意為「忽視、疏於照顧」，是長期的不作為；但野火是突發的破壞事件，而且 neglect 無法解釋需要數十年復原的森林損害。"

          notes:[
            {term:"ravage", pos:"vt.", gloss:"嚴重摧毀、蹂躪（be ravaged by war／famine／wildfires）。n. the ravages of time 歲月的摧殘。", ex:"The town was ravaged by floods.", exZh:"這座小鎮被洪水嚴重摧毀。"},
            {term:"inflict", pos:"vt.", gloss:"inflict sth on sb 把（傷害、痛苦、懲罰）施加於某人。被動：Heavy damage was inflicted on the city. 注意與 ravage 的句型差異。"}

            {term:"prevail / prevalent / prevailing", pos:"字族", gloss:"v. prevail 獲勝、盛行／adj. prevalent 普遍的（be prevalent among 在…之間盛行）／adj. prevailing 現行的、主流的。"}

          translation:"專家對這款保健食品能逆轉老化的說法仍抱持懷疑，因為背後的公司從未發表過任何一篇同儕審查的研究。",

            B:"be dubious about sth 意為「對…存疑」。決定性線索是 since 引導的原因：never published a single peer-reviewed study（從未發表任何同儕審查的研究）——缺乏科學證據正是專家保留態度的依據；動詞 remain（仍然）也顯示這是持續未被說服的立場。",

            D:"hopeful 意為「懷抱希望的」，語意方向與理由子句相衝突：沒有任何研究支持，專家不會因此樂觀。",
          },
          notes:[
            {term:"be dubious about", pos:"phr.", gloss:"對…存疑（＝be skeptical／doubtful about）。adj. dubious 也指「可疑的」（dubious credentials 可疑的資歷）。集訓二作業二第 72 題也考過這個字。", ex:"I'm dubious about the whole plan.", exZh:"我對整個計畫都有疑慮。"},
            {term:"peer-reviewed", pos:"adj.", gloss:"經同儕審查的（a peer-reviewed journal 同儕審查期刊）。學術可信度的關鍵指標，科普閱讀常見。"}
          ]},

          translation:"由於這起犯罪發生在公海上的一艘外籍船隻，警方主張此案不在他們的管轄範圍內，拒絕介入。",

            {term:"veteran", pos:"n. / adj.", gloss:"老將、資深者（a veteran player／journalist）；也指「退伍軍人」（a war veteran）。"}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const wordOf = q => q.options ? q.options[q.answer] : (q.answerText || '');

const findQ = (n, sid) => allQ.find(q => String(q.n) === String(n) && (sid == null || q.__sid === sid));

function renderPassage(g, i, sid) {
  let html = esc(g.passage);
  g.questions.forEach(q => {
    if (!q.evidence) return;
    const t = esc(q.evidence);
    if (html.includes(t)) html = html.replace(t, `<span class="hl ev" data-ev="${q.n}">${t}</span>`);
  });
  html = html.replace(/__(\d+)__/g, (m, n) =>
    `<button class="blank" data-blank="${n}" aria-label="第 ${n} 題空格">${n}</button>`);
  const body = '<div class="passage">' +
    html.split(/\n{2,}/).map(p => '<p>' + p.replace(/\n/g, ' ') + '</p>').join('') + '</div>';
  if (!g.zh) return body;
  const id = sid + '-' + i;
  return body +
    `<button class="zhbtn" data-zh="${id}">全文中譯</button>` +
    `<div class="zhbox" id="zh-${id}">` +
      g.zh.split(/\n{2,}/).map(p => '<p>' + esc(p).replace(/\n/g, ' ') + '</p>').join('') +
    '</div>';
}

function renderQ(q) {
  const parts = [];
  if (q.options) {
    const ks = Object.keys(q.options);
    parts.push('<div class="opts">' + ks.map(k =>
      `<div class="opt"><span class="opt-k">(${k})</span><span>${esc(q.options[k])}</span></div>`).join('') + '</div>');
  }
  const head = `<div class="q-tag"><span class="q-n">${String(q.n).padStart(2,'0')}</span><span class="q-kind">${esc(q.kind || '')}</span></div>` +
    (q.prompt ? `<p class="prompt">${esc(q.prompt)}</p>` : '') +
    (q.stem ? `<p class="stem">${esc(q.stem).replace(/\n/g,'<br>')}</p>` : '');

  let ans = '';
  if (q.answers) {
    ans = '<ul class="fills">' + q.answers.map(a =>
      `<li class="fill"><span class="fill-k">${esc(a.k)}</span><span class="fill-w hl" data-ansmulti>${esc(a.w)}</span><span class="fill-n">${esc(a.note || '')}</span></li>`).join('') + '</ul>';
  } else {
    const label = q.options ? `(${q.answer}) ${esc(wordOf(q))}` :
      (q.answer ? `(${q.answer}) ${esc(q.answerText)}` : esc(q.answerText));
    ans = `<p class="ans"><span class="ans-k">答案</span><span class="ans-v hl" data-ans="${q.n}">${label}</span></p>`;
  }

  let expl = '';
  if (q.explain) {
    expl = '<ul class="lines">' + Object.keys(q.options).map(k => {
      const right = q.multi ? q.multi.includes(k) : k === q.answer;
      return `<li class="line ${right ? 'right' : 'wrong'}"><span class="line-k">(${k})</span><span>${esc(q.explain[k] || '')}</span></li>`;
    }).join('') + '</ul>';
  }
  const why = q.why ? `<p class="why">${esc(q.why)}</p>` : '';
  const sample = q.sample ? `<div class="sample"><p class="note-h">參考範文</p>` +
    q.sample.split(/\n{2,}/).map(p => `<p>${esc(p).replace(/\n/g,' ')}</p>`).join('') + '</div>' : '';
  const evid = q.evidence ? `<p class="evid"><span>文中依據</span>${esc(q.evidence)}</p>` : '';
  const notes = (q.notes || []).length ? `<div class="note"><p class="note-h">重點整理</p>` +
    q.notes.map(nt => `<p class="note-i"><span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span><span class="gloss">${esc(nt.gloss || '')}</span>` +
      (nt.ex ? `<span class="ex">${esc(nt.ex)}<i>${esc(nt.exZh || '')}</i></span>` : '') + '</p>').join('') + '</div>' : '';

  return `<article class="q" id="q-${q.__sid}-${q.n}" data-n="${q.n}" data-sid="${q.__sid}">
    <div class="q-top">${head}${parts.join('')}
      <button class="reveal" aria-expanded="false" aria-controls="body-${q.n}">看詳解</button>
    </div>
    <div class="body" id="body-${q.n}">
      ${ans}${q.translation ? `<p class="zh">${esc(q.translation)}</p>` : ''}${expl}${why}${evid}${sample}${notes}
    </div>
  </article>`;
}

document.getElementById('main').innerHTML = EXAM.sections.map((s, i) => `
  <section class="sec" id="sec-${s.id}">
    <div class="sec-head">
      <span class="sec-num">${String(i+1).padStart(2,'0')}</span>
      <h2 class="sec-label">${esc(s.label)}</h2>
      <span class="sec-score">${esc(s.score || '')}</span>
    </div>
    ${s.instruction ? `<p class="sec-inst">${esc(s.instruction)}</p>` : ''}
    ${s.bank ? `<div class="bank${s.bankWide ? ' wide' : ''}">${Object.keys(s.bank).map(k =>
      `<div class="bank-i" data-bank="${k}"><span>(${k})</span>${esc(s.bank[k])}</div>`).join('')}</div>` : ''}
    ${s.groups.map((g, gi) => (g.passage ? renderPassage(g, gi, s.id) : '') + g.questions.map(renderQ).join('')).join('')}
  </section>`).join('');

const items = [];
allQ.forEach(q => (q.notes || []).forEach(nt => items.push({ ...nt, n: q.n, sid: q.__sid })));
document.getElementById('side').innerHTML = `
  <p class="side-h">Notes</p>
  <p class="side-t">本卷重點 ${items.length} 則</p>
  <ul class="card-list">${items.map(nt => `
    <li class="card-item"><a href="#q-${nt.sid}-${nt.n}">
      <span class="jump">第 ${nt.n} 題</span>
      <span class="term">${esc(nt.term)}</span><span class="pos">${esc(nt.pos || '')}</span>
      <div class="gloss">${esc(nt.gloss || '')}</div>
    </a></li>`).join('')}</ul>
  <p class="side-note">點任一則可跳到出處題目。用瀏覽器列印（Ctrl／⌘ + P）會自動展開全部詳解與中譯，可直接印成講義。</p>`;

document.getElementById('foot').textContent = `共 ${allQ.length} 題 · ${EXAM.footer}`;

function setOpen(card, open) {
  card.classList.toggle('open', open);
  const btn = card.querySelector('.reveal');
  btn.setAttribute('aria-expanded', open);
  btn.firstChild.nodeValue = open ? '收合詳解' : '看詳解';
  const n = card.dataset.n;
  const sec = card.closest('.sec') || document;
  card.querySelectorAll('.hl').forEach(h => h.classList.toggle('on', open));
  const ev = sec.querySelector(`[data-ev="${n}"]`);
  if (ev) ev.classList.toggle('on', open);
  const q = findQ(n, card.dataset.sid);
  if (q && q.answer && q.answerText) {
    const bi = sec.querySelector(`[data-bank="${q.answer}"]`);
    if (bi) bi.classList.toggle('used', open);
  }
  const bl = sec.querySelector(`[data-blank="${n}"]`);
  if (bl) {
    if (open) {
      bl.classList.add('filled');
      bl.innerHTML = `<sup>${n}</sup><span class="hl">${esc(wordOf(q))}</span>`;
      requestAnimationFrame(() => bl.querySelector('.hl').classList.add('on'));
    } else {
      bl.classList.remove('filled');
      bl.textContent = n;
    }
  }
}
document.addEventListener('click', e => {
  const rv = e.target.closest('.reveal');
  if (rv) { const c = rv.closest('.q'); setOpen(c, !c.classList.contains('open')); return; }
  const zb = e.target.closest('.zhbtn');
  if (zb) { zb.classList.toggle('on'); document.getElementById('zh-' + zb.dataset.zh).classList.toggle('on'); return; }
  const bl = e.target.closest('.blank');
  if (bl) {
    const c = document.getElementById('q-' + bl.dataset.blank);
    if (!c.classList.contains('open')) setOpen(c, true);
    c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
});
toggleAll.addEventListener('click', () => {
  const open = toggleAll.textContent === '全部展開';
  document.querySelectorAll('.q').forEach(c => setOpen(c, open));
  toggleAll.textContent = open ? '全部收合' : '全部展開';
});
window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.q').forEach(c => setOpen(c, true));
  document.querySelectorAll('.zhbox').forEach(b => b.classList.add('on'));
  toggleAll.textContent = '全部收合';
});
</script>
</body>
</html>
